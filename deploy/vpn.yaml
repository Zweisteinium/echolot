# Optional: Soulseek through a VPN, so peers don't see your IP address. The Sockseek daemon joins gluetun's
# network. Echolot stays outside and still reaches it as sockseek:5031. Turn it on in .env with
# COMPOSE_FILE=compose.yaml:vpn.yaml. The settings per provider are in github.com/qdm12/gluetun-wiki.
#
# With a provider that forwards a port (ProtonVPN, PIA and others), peers behind a firewall can connect too.
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set the VPN settings in .env}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c "echo {{PORT}} > /daemon/listen-port"
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/sockseek:/daemon           # the forwarded port goes here, the daemon restarts with it
    networks:
      default:
        aliases: [sockseek]
    restart: unless-stopped

  sockseek:
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true                     # follows a recreated gluetun into its new network
