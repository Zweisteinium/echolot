# Echolot with the Sockseek daemon for Soulseek and Navidrome to play the library.
#
#   cp .env.example .env                  # set MUSIC to your music folder
#   mkdir -p data/echolot data/sockseek data/navidrome
#   docker compose up -d
#
# Then create Navidrome's admin at http://<this host>:4533 and log in to Echolot at :8490 with it.
# For Soulseek through a VPN, see vpn.yaml.
name: echolot

x-user: &user "${PUID:-1000}:${PGID:-1000}"

services:
  echolot:
    image: lordlayer/echolot:0.16.0        # or build it from this repository with build: ..
    user: *user
    ports:
      - "${ECHOLOT_PORT:-8490}:8490"
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_DAEMON_DIR: /daemon
      ECHOLOT_NAVIDROME_URL: ${NAVIDROME_URL:-http://navidrome:4533}  # its accounts are Echolot's logins
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}  # the address of a reverse proxy in front
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/echolot:/data              # database, settings, encrypted secrets
      - ${MUSIC:?set MUSIC in .env}:/music
      - ./data/sockseek:/daemon           # Echolot writes the daemon's Soulseek login here
    networks:
      default:
      navidrome:
        ipv4_address: ${HEARTS_NET:-10.253.53}.2
    restart: unless-stopped

  sockseek:                               # searches and downloads on Soulseek, for Echolot only
    image: lordlayer/echolot-sockseek:febfba1-2  # Sockseek 3.0.6, or build it with build: ./sockseek
    user: *user
    init: true
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/sockseek:/daemon
      - ${MUSIC}/inbox/soulseek:/music/inbox/soulseek   # the only place it writes
    depends_on:
      echolot:
        condition: service_healthy        # Echolot creates the inbox first, owned by PUID
    restart: unless-stopped

  navidrome:                              # plays the library in the browser and in any Subsonic app
    image: deluan/navidrome:0.64.1
    user: *user
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_SCANNER_SCHEDULE: "@every 1h"    # a fallback, its file watcher sees changes within seconds
      ND_AUTOIMPORTPLAYLISTS: "true"      # Echolot's playlists, each then given to its user
      # Only Echolot may act as a user, to heart each user's liked songs
      ND_EXTAUTH_TRUSTEDSOURCES: ${HEARTS_NET:-10.253.53}.2/32
      ND_EXTAUTH_USERHEADER: X-Echolot-User
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/navidrome:/data
      - ${MUSIC}:/music:ro                # inbox/ is skipped, it has a .ndignore
    networks:
      navidrome:
        ipv4_address: ${HEARTS_NET:-10.253.53}.3
    depends_on:
      echolot:
        condition: service_healthy
    restart: unless-stopped

networks:
  navidrome:                              # Echolot and Navidrome only, with fixed addresses
    ipam:
      config:
        - subnet: ${HEARTS_NET:-10.253.53}.0/29
