# Echolot with everything it needs: the Sockseek daemon (Soulseek) and Navidrome (plays the library).
#
#   cp .env.example .env                  # set MUSIC to your music folder
#   mkdir -p data/echolot data/sockseek data/navidrome
#   docker compose up -d                  # the first start builds Sockseek (a few minutes)
#
# Echolot makes tracks/, playlists/ and inbox/ in MUSIC itself (as PUID); the others start after it. Then
# create Navidrome's admin at http://<this host>:4533 and log in to Echolot at :8490 with it. Soulseek
# through a VPN: vpn.yaml.
name: echolot

x-user: &user "${PUID:-1000}:${PGID:-1000}"

services:
  echolot:
    image: lordlayer/echolot:0.9.6        # or build it from this repository: build: ..
    user: *user
    ports:
      - "${ECHOLOT_PORT:-8490}:8490"
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_DAEMON_DIR: /daemon
      ECHOLOT_NAVIDROME_URL: ${NAVIDROME_URL:-http://navidrome:4533}  # its accounts log in to Echolot
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/echolot:/data              # database, settings, encrypted secrets
      - ${MUSIC:?set MUSIC in .env}:/music
      - ./data/sockseek:/daemon           # Echolot writes the daemon's Soulseek login here
    restart: unless-stopped

  sockseek:                               # searches and downloads on Soulseek for Echolot (port 5031, not published)
    build: https://github.com/fiso64/sockseek.git#febfba1fe6125a768c99dd883e477863cee07fbf  # v3.0.5+, tested
    image: sockseek:local
    user: *user
    init: true
    entrypoint: ["/bin/sh", "/run.sh"]
    environment:
      HOME: /tmp
      TZ: ${TZ:-UTC}
    volumes:
      - ./sockseek/run.sh:/run.sh:ro
      - ./data/sockseek:/daemon
      - ${MUSIC}/inbox/soulseek:/music/inbox/soulseek   # the only place it writes
    depends_on:
      echolot:
        condition: service_healthy        # (Echolot makes the inbox, owned by PUID)
    restart: unless-stopped

  navidrome:                              # plays the library in the browser and in any Subsonic app
    image: deluan/navidrome:0.64.1
    user: *user
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_SCANNER_SCHEDULE: "@every 1h"    # a safety net: its file watcher picks up changes within seconds
      ND_AUTOIMPORTPLAYLISTS: "true"      # Echolot's playlists (Echolot then gives each to its user)
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/navidrome:/data
      - ${MUSIC}:/music:ro                # tracks/ and playlists/; inbox/ has a .ndignore (skipped)
    depends_on:
      echolot:
        condition: service_healthy
    restart: unless-stopped
