[project]
name = "echolot"
version = "0.1.0"
description = "Self-hosted music library sync: playlists and likes in, only the right songs in the best available quality out."
readme = "README.md"
authors = [
    { name = "Zweisteinium", email = "lordlayer@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
echolot = "echolot.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
