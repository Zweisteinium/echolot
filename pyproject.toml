[project]
name = "echolot"
version = "0.15.0"
description = "Self-hosted music library sync: playlists and likes in, only the right songs in the best available quality out."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Zweisteinium", email = "40574703+Zweisteinium@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "yt-dlp[curl-cffi,default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
echolot = "echolot.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
required-version = ">=0.13.7"  # the uv of the lockfile: setup-uv in CI reads it, the Dockerfile copies the same minor

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true  # collapse whatever fits into one line

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job; long strings and comments are fine
    "RUF001",  # non-ASCII characters in strings are intended (music titles, typography)
    "RUF002",  # ... and in docstrings (they quote such strings)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # (as the formatter's skip-magic-trailing-comma)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
