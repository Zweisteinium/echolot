# Development instance on debian-server, next to production (/opt/echolot, port 8490; PLAN.md).
# It works on its own database in ./data and runs no jobs (ECHOLOT_WORKER=off); the music library is
# read-only, so trying things here never changes what production uses.
name: echolot-dev
services:
  echolot:
    build: .
    image: echolot:dev
    container_name: echolot-dev
    user: "1000:1000"
    ports:
      - "192.168.178.42:8491:8490" # home network only
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_WORKER: "off"
    volumes:
      - ./data:/data
      - /media/hdd/medialib/audio/music:/music:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
