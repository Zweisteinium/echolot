# Development instance on debian-server. Echolot writes to ./data and, in the pipeline's config
# directory, only sources.yml and schedule.yml (from the Sources and Settings pages); the music
# library and the pipeline's state, logs and scripts are mounted read-only.
services:
  echolot:
    build: .
    image: echolot:dev
    container_name: echolot-dev
    user: "1000:1000"
    ports:
      - "192.168.178.42:8490:8490" # home network only (no login yet)
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_PIPELINE_DIR: /pipeline
    volumes:
      - ./data:/data
      - /media/hdd/medialib/audio/music:/music:ro
      - /opt/sockseek/config:/pipeline
      - /opt/sockseek/config/state:/pipeline/state:ro
      - /opt/sockseek/config/logs:/pipeline/logs:ro
      - /opt/sockseek/config/scripts:/pipeline/scripts:ro
      - /opt/sockseek/config/crontabs:/pipeline/crontabs:ro
      - /etc/localtime:/etc/localtime:ro # timestamps in the pipeline's logs are local time
    restart: unless-stopped
