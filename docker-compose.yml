# Development instance on debian-server, next to production (/opt/echolot, port 8490; PLAN.md).
# It works on its own database in ./data (a copy of production's) and reads the pipeline's config
# directory and the music library read-only, so trying things here never changes what production
# or the pipeline use.
name: echolot-dev
services:
  echolot:
    build: .
    image: echolot:dev
    container_name: echolot-dev
    user: "1000:1000"
    ports:
      - "192.168.178.42:8491:8490" # home network only
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_PIPELINE_DIR: /pipeline
    volumes:
      - ./data:/data
      - /media/hdd/medialib/audio/music:/music:ro
      - /opt/sockseek/config:/pipeline:ro
      - /etc/localtime:/etc/localtime:ro # timestamps in the pipeline's logs are local time
    restart: unless-stopped
