# Development instance on debian-server. It only writes to ./data; the music library and the
# music-sync pipeline's config are mounted read-only.
services:
  echolot:
    build: .
    image: echolot:dev
    container_name: echolot-dev
    user: "1000:1000"
    ports:
      - "192.168.178.42:8490:8490" # home network only (no login yet)
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_PIPELINE_DIR: /pipeline
    volumes:
      - ./data:/data
      - /media/hdd/medialib/audio/music:/music:ro
      - /opt/sockseek/config:/pipeline:ro
      - /etc/localtime:/etc/localtime:ro # timestamps in the pipeline's logs are local time
    restart: unless-stopped
