# Development instance next to production: its own database in ./data, no jobs (ECHOLOT_WORKER=off),
# the music library read-only, so trying things here never changes what production uses.
# Machine-specific values come from .env (not in git): ECHOLOT_BIND (address:port), MUSIC_DIR.
name: echolot-dev
services:
  echolot:
    build: .
    image: echolot:dev
    container_name: echolot-dev
    user: "1000:1000"
    ports:
      - "${ECHOLOT_BIND:-127.0.0.1:8491}:8490"
    environment:
      ECHOLOT_LIBRARY_DIR: /music/tracks
      ECHOLOT_WORKER: "off"
    volumes:
      - ./data:/data
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - ./data/inbox:/music/inbox  # its own, writable: uploads by hand can be tried (importing still fails: the library is read-only)
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
