{# the Record dialog: opened by hx-get="/recordings/new[?list=<key>]" hx-target="#record-body" #}
<dialog id="record" class="modal record-dialog" aria-label="Record with Mitschnitt"><div id="record-body"></div></dialog>
<script>
  // the dialog opens with its form; the choice sets the export link's query
  (() => {
    const dialog = document.getElementById("record");
    const body = document.getElementById("record-body");
    const update = () => {
      const below = body.querySelector("input[name=below]:checked");
      const link = body.querySelector("[data-export]");
      if (link && below) link.href = `${link.dataset.export}below=${below.value}`;
    };
    document.addEventListener("htmx:afterSwap", (e) => {
      if (e.target !== body) return;
      update();
      if (body.firstElementChild && !dialog.open) dialog.showModal();
    });
    body.addEventListener("change", update);
    dialog.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) dialog.close(); });
  })();
  // the session panel's clock and bar run on locally every frame; a new panel (every 5 s, whole seconds from
  // the device) resets the clock only when more than 2 s off (a new song, a seek), so polls cause no jumps
  (() => {
    let anchor = null;  // {song, at: position (s) at performance.now() t, el: the panel read}
    const draw = () => {
      const clock = document.querySelector("#recording [data-clock]");
      const now = performance.now();
      if (!clock) {
        anchor = null;
      } else {
        if (clock !== anchor?.el) {  // a new panel
          const said = +clock.dataset.at, song = clock.dataset.song;
          const ours = anchor && anchor.song === song ? anchor.at + (now - anchor.t) / 1000 : null;
          if (ours === null || Math.abs(ours - said) > 2) anchor = { song, at: said, t: now };
          anchor.el = clock;
        }
        const at = Math.min(+clock.dataset.total, anchor.at + (now - anchor.t) / 1000);
        const text = `${Math.floor(at / 60)}:${String(Math.floor(at % 60)).padStart(2, "0")}`;
        if (clock.textContent !== text) clock.textContent = text;
        const bar = document.querySelector("#recording [data-all]");
        if (bar && +bar.dataset.all) bar.firstElementChild.style.width = `${(100 * (+bar.dataset.done + at)) / +bar.dataset.all}%`;
      }
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  })();
</script>
