{% extends "base.html" %}
{% block title %}Log in · Echolot{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" action="/login" class="stack">{{ csrf_input }}
    <input type="hidden" name="next" value="{{ next }}">
    <label>User <input type="text" name="name" value="{{ name or 'admin' }}" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <p><button class="primary">Log in</button></p>
  </form>
</section>
{% endblock %}
