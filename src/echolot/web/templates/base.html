<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Echolot{% endblock %}</title>
  <link rel="icon" href="{{ asset('echolot.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ asset('favicon.ico') }}" sizes="48x48">
  <link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  <script src="{{ asset('htmx.min.js') }}" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <header>
    <a class="logo" href="/"><img src="{{ asset('echolot.svg') }}" alt="" width="24" height="24">Echolot</a>
    {% if user %}
    <nav>
      <a href="/" {% if nav == 'overview' %}aria-current="page"{% endif %}>Overview</a>
      <a href="/sources" {% if nav == 'sources' %}aria-current="page"{% endif %}>Sources</a>
      <a href="/missing" {% if nav == 'missing' %}aria-current="page"{% endif %}>Missing</a>
      <a href="/review" {% if nav == 'review' %}aria-current="page"{% endif %}>Review</a>
      <a href="/activity" {% if nav == 'activity' %}aria-current="page"{% endif %}>Activity</a>
      <a href="/accounts" {% if nav == 'accounts' %}aria-current="page"{% endif %}>Accounts</a>
      <a href="/settings" {% if nav == 'settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <form method="post" action="/logout" class="account">{{ csrf_input }}
      <span class="muted small">{{ user.name }}</span> <button class="link">Log out</button>
    </form>
    {% endif %}
    <span class="muted version">v{{ version }}{% if commit %} · {{ commit }}{% endif %}</span>
  </header>
  <main>
    {% if ok %}<div class="flash ok" role="status">{{ ok }}</div>{% endif %}
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // copy buttons (data-copy="#id"): the clipboard API needs https; on plain http select and copy
    document.addEventListener("click", async (ev) => {
      const b = ev.target.closest("[data-copy]");
      if (!b) return;
      const field = document.querySelector(b.dataset.copy);
      const text = field.value ?? field.textContent;
      let done = false;
      try { await navigator.clipboard.writeText(text); done = true; } catch (e) {}
      if (!done) { field.select?.(); try { done = document.execCommand("copy"); } catch (e) {} }
      b.textContent = done ? "Copied" : "Select and copy";
      setTimeout(() => (b.textContent = "Copy"), 2000);
    });
    // song links with data-app="spotify:track:…" try the desktop app first. A page cannot ask whether an app is
    // installed, so if no app takes the focus within 2 s the web link opens instead. Phones and middle or
    // modifier clicks keep the plain https link (phones hand it to an installed app themselves).
    document.addEventListener("click", (ev) => {
      const a = ev.target.closest("a[data-app]");
      if (!a || ev.button || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
      if (matchMedia("(pointer: coarse)").matches) return;
      ev.preventDefault();
      let left = false;
      const away = () => (left = true);
      window.addEventListener("blur", away, { once: true });
      document.addEventListener("visibilitychange", away, { once: true });
      if (navigator.userAgent.includes("Firefox")) {  // shows an error page for a scheme without an app
        const frame = Object.assign(document.createElement("iframe"), { hidden: true, src: a.dataset.app });
        document.body.append(frame);
        setTimeout(() => frame.remove(), 5000);
      } else {
        location.href = a.dataset.app;
      }
      setTimeout(() => {
        window.removeEventListener("blur", away);
        document.removeEventListener("visibilitychange", away);
        if (left) return;
        const tab = window.open(a.href, "_blank");
        if (tab) tab.opener = null;
        else location.href = a.href;  // popup blocked
      }, 2000);
    });
    // Review: Listen plays at once (and pauses any other player); Close match first shows the name it files as
    document.addEventListener("toggle", (ev) => {
      const d = ev.target;
      if (!d.matches?.("details.listen")) return;
      const player = d.querySelector("audio");
      if (!d.open) {
        delete d.dataset.naming;
        return player?.pause();
      }
      if (d.dataset.naming) return;
      for (const other of document.querySelectorAll("audio")) if (other !== player) other.pause();
      player?.play().catch(() => {});
    }, true);  // toggle does not bubble
    document.addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-close]");
      const d = b && document.getElementById(b.dataset.close);
      if (!d || d.open) return;
      ev.preventDefault();
      d.dataset.naming = "1";
      d.open = true;
      d.querySelector("input[name=name]")?.focus();
      b.textContent = "File as close match";
    });
    // Sources: show one kind of list (yours, collaborative, by others), remembered per service
    const showKind = (filter, value) => {
      const input = filter.querySelector(`input[value="${value}"]`);
      const cards = filter.nextElementSibling;
      if (!input || !cards) return;
      input.checked = true;
      cards.dataset.show = value;
    };
    document.addEventListener("change", (e) => {
      const filter = e.target.closest(".kind-filter");
      if (!filter) return;
      showKind(filter, e.target.value);
      try { localStorage.setItem("echolot:show-" + filter.dataset.filter, e.target.value); } catch (err) {}
    });
    document.addEventListener("htmx:load", (e) => {  // the card fragments arrive after the page
      const elt = e.detail.elt;
      for (const filter of elt.matches(".kind-filter") ? [elt] : elt.querySelectorAll(".kind-filter")) {
        let value = null;
        try { value = localStorage.getItem("echolot:show-" + filter.dataset.filter); } catch (err) {}
        if (value) showKind(filter, value);
      }
    });
    // remember which collapsible sections are closed (per browser; the page works without it)
    for (const d of document.querySelectorAll("details[data-remember]")) {
      const key = "echolot:" + d.dataset.remember;
      try { if (localStorage.getItem(key) === "closed") d.open = false; } catch (e) {}
      d.addEventListener("toggle", () => {
        try { localStorage.setItem(key, d.open ? "open" : "closed"); } catch (e) {}
      });
    }
  </script>
</body>
</html>
