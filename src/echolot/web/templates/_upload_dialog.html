{# the upload dialog (web/upload.py), on the pages that open it: a button or a song's icon with
   hx-get="/missing/upload[?song=<key>]" hx-target="#upload-body" #}
{% from "_icons.html" import sprite %}
{{ sprite(['upload']) }}
<dialog id="upload" class="modal" aria-label="Upload files"><div id="upload-body"></div></dialog>
<script>
  // opens with its first step; lists the files picked or dropped; shows that it works (uploading, checking,
  // importing); takes imported songs off Missing (another page shows anew when the dialog closes); a batch
  // left by closing the dialog (Esc, Cancel) is deleted
  (() => {
    const dialog = document.getElementById("upload");
    const body = document.getElementById("upload-body");
    const csrf = () => JSON.parse(document.body.getAttribute("hx-headers") || "{}")["X-CSRF-Token"] || "";
    let reload = false;  // songs imported on a page that does not take them off by itself
    const busy = (text) => {
      body.querySelectorAll("button").forEach((b) => (b.disabled = true));
      const note = body.querySelector(".busy");
      if (note) { note.hidden = false; if (text) note.textContent = text; }
    };
    document.addEventListener("htmx:afterSwap", (e) => {
      if (e.target !== body) return;
      if (!body.firstElementChild) return dialog.close();
      if (!dialog.open) dialog.showModal();
      const done = body.querySelector("[data-imported]");
      if (!done) return;
      const keys = JSON.parse(done.dataset.imported);
      const count = document.getElementById("missing-count");
      if (!count) { reload = keys.length > 0; return; }  // another page: shown anew when the dialog closes
      for (const key of keys) {
        document.querySelectorAll(`tr[data-song="${CSS.escape(key)}"]`).forEach((tr) => tr.remove());
      }
      count.textContent = document.querySelectorAll("table.missing tbody tr[data-song]").length.toLocaleString("en");
    });
    document.addEventListener("htmx:beforeRequest", (e) => {
      if (!body.contains(e.detail.elt) || e.detail.elt.hasAttribute("data-cancel")) return;
      busy(e.detail.elt.matches("[hx-post$='/import']") ? "Importing…" : "Uploading…");
    });
    document.addEventListener("htmx:xhr:progress", (e) => {
      const bar = document.getElementById("upload-progress");
      if (!bar || !e.detail.lengthComputable) return;
      bar.hidden = false;
      bar.value = Math.round((e.detail.loaded / e.detail.total) * 100);
      if (bar.value >= 100) busy("Checking the files (quality, length, audio)…");
    });
    body.addEventListener("change", (e) => {
      const input = e.target.closest("input[type=file]");
      if (!input) return;
      const list = body.querySelector(".picked"), names = [...input.files].map((f) => f.name);
      list.replaceChildren(...names.slice(0, 8).map((n) => Object.assign(document.createElement("li"), { textContent: n })));
      if (names.length > 8) list.append(Object.assign(document.createElement("li"), { textContent: `and ${names.length - 8} more`, className: "muted" }));
      list.hidden = !names.length;
      body.querySelector(".drop-text").innerHTML = names.length ? `<b>${names.length} file${names.length > 1 ? "s" : ""}</b> chosen · choose again` : "<b>Choose files</b> or drop them here";
      body.querySelector("[data-check]").disabled = !names.length;
    });
    for (const type of ["dragenter", "dragover"]) body.addEventListener(type, (e) => e.target.closest(".drop")?.classList.add("drag"));
    for (const type of ["dragleave", "drop"]) body.addEventListener(type, (e) => e.target.closest(".drop")?.classList.remove("drag"));
    body.addEventListener("click", (e) => {
      const drop = e.target.closest("[data-drop-row]");
      if (drop) {
        drop.closest("tr").remove();
        const left = body.querySelectorAll("input[name^='song_']").length;
        const go = body.querySelector("[data-import]");
        if (go) { go.disabled = !left; go.textContent = left ? `Import ${left}` : "Import"; }
        return;
      }
      if (e.target.closest("[data-close]")) dialog.close();
    });
    dialog.addEventListener("close", () => {
      const open = body.querySelector("[data-batch]");
      if (open) fetch(`/missing/upload/${open.dataset.batch}/cancel`, { method: "POST", headers: { "X-CSRF-Token": csrf() } });
      body.replaceChildren();
      if (reload) location.reload();
    });
  })();
</script>
