{% extends "base.html" %}
{% block title %}First user · Echolot{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Welcome to Echolot</h1>
  <p class="muted small">Create the user that logs in to Echolot. More can be added later with <code>echolot user add</code>.</p>
  <form method="post" action="/setup" class="stack">{{ csrf_input }}
    <input type="hidden" name="token" value="{{ token }}">
    <label>User name <input type="text" name="name" value="{{ name or '' }}" autocomplete="username" required autofocus></label>
    <label>Password <span class="muted small">at least 10 characters</span><input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
    <label>Password again <input type="password" name="repeat" autocomplete="new-password" minlength="10" required></label>
    <p><button class="primary">Create and log in</button></p>
  </form>
</section>
{% endblock %}
