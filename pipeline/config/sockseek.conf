# Sockseek defaults for every run started by scripts/music-sync.py
# (input CSV of missing songs, credentials and index path are passed on the command line).
# Sockseek never writes into the library: it downloads into the inbox and post-track.sh hands every file to
# library.py, which decides "same song?" exactly and files it without ever overwriting (Sockseek's own mover
# deletes an existing target, and its name skip matches "Glow" to "Glow - X Remix").
output-dir = /music/inbox/sockseek
# inbox files are named by CSV row: Sockseek pastes {variables} into the on-complete command unescaped, so a
# title with a " (e.g. 7" Mix, From "Cars 2") broke the hook's arguments; the hook reads artist/title from the CSV
name-format = {row}

# quality: prefer FLAC, otherwise the best available (soft preferences never filter results out)
pref-format = flac
pref-min-bitrate = 200
# rank hi-res (24/96, 24/192: 70-150+ MB per 3 min) below CD-quality FLAC; if only hi-res exists it is
# downloaded and post-track.sh resamples it to 44.1/48 kHz 24 bit (inaudible, about half the size)
pref-max-samplerate = 48000
pref-max-bitrate = 2500
pref-strict-title = true
pref-strict-artist = true
# required, not just preferred: the artist must appear in the Soulseek path. Without this a same-titled song of
# another artist can win (e.g. "Vanilla - All Night" for "TINOS - All Night"). The title is checked by library.py
# (exact, or contained when the length matches within 3 s) before anything is filed.
strict-artist = true
length-tol = 3
remove-ft = true
fast-search = true

# what to download is decided by music-sync.py/library.py (exact artist + title + length); every run passes
# --no-skip-existing, so Sockseek's fuzzy skip checks are off

# YouTube fallback is NOT done here: YouTube blocks the VPN exit. The sockseek-fallback container
# (home IP) handles songs Soulseek failed twice (music-sync.py fallback).
yt-dlp = false
# queued uploads on busy shares take a while to start
max-stale-time = 90000

# playlists (.m3u) are generated by music-sync.py, not by Sockseek
write-playlist = false
no-progress = true
on-complete = when=success scope=track update-index -- /config/scripts/post-track.sh "{path}" "{row}" "{uri}" "{slsk-filename}" "{slsk-foldername}"

