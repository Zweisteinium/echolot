# music-sync pipeline: one image, two containers with the same /config.
#   sockseek           Soulseek downloads behind the VPN (shares gluetun's network, like slskd)
#   sockseek-fallback  SoundCloud and the YouTube fallback on the home IP: YouTube refuses VPN exits
#                      ("confirm you're not a bot") and SoundCloud rate-limits them
# MUSIC_DIR and the secrets come from .env (see .env.example).
services:
  # The official Sockseek image, built from src/ with its own Dockerfile. Only a build step for the image
  # below (scale 0: never started).
  sockseek-upstream:
    build: ./src
    image: sockseek:upstream
    scale: 0

  sockseek:
    build:
      context: .
      additional_contexts:
        sockseek-upstream: service:sockseek-upstream
    image: sockseek:local
    container_name: sockseek
    network_mode: "container:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - DOCKER_MODS=linuxserver/mods:universal-cron
      - ROLE=main
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ${MUSIC_DIR}:/music
    restart: unless-stopped

  sockseek-fallback:
    image: sockseek:local
    container_name: sockseek-fallback
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - DOCKER_MODS=linuxserver/mods:universal-cron
      - ROLE=fallback
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ${MUSIC_DIR}:/music
    restart: unless-stopped
    depends_on:
      - sockseek
