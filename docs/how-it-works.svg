<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 360" width="1064" role="img" aria-label="How Echolot works: it reads your lists on Spotify, SoundCloud and YouTube, gets the songs from Soulseek (through Sockseek or slskd) or from YouTube and SoundCloud, files them into your music folder, and Navidrome streams them to Feishin, Symfonium or any Subsonic app">
  <title>How Echolot works</title>
  <style>
    .box { fill: #ffffff; stroke: #d6dee8; stroke-width: 1.5; }
    .hero { fill: #f3f8ff; stroke: url(#brand); stroke-width: 2.5; }
    .side { fill: #f7f9fc; stroke: #d6dee8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .tag { font: 600 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f6bcf; letter-spacing: 0.06em; }
    .h { font: 650 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a2230; }
    .t { font: 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f6b7a; }
    .m { font: 13.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1a2230; }
    .label { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f6b7a; }
    .arrow { stroke: #93a3b8; stroke-width: 2; fill: none; }
    .arrow.hot { stroke: #1f6bcf; }
    .head { fill: #93a3b8; } .head.hot { fill: #1f6bcf; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #121922; stroke: #2a3644; }
      .hero { fill: #0f1d2e; }
      .side { fill: #0f151d; stroke: #2a3644; }
      .tag { fill: #6aa9f2; }
      .h, .m { fill: #e4e8ee; }
      .t, .label { fill: #8d98a7; }
      .arrow { stroke: #4b5a6c; } .head { fill: #4b5a6c; }
      .arrow.hot { stroke: #6aa9f2; } .head.hot { fill: #6aa9f2; }
    }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#174ea6"/><stop offset="0.55" stop-color="#1f6bcf"/><stop offset="1" stop-color="#2ba3b4"/></linearGradient>
    <radialGradient id="echo" cx="0" cy="0" r="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#174ea6"/><stop offset="1" stop-color="#6aa9f2"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head hot" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- the main row: five boxes of one size, 56 apart -->
  <rect class="box" x="10" y="20" width="164" height="168" rx="14"/>
  <text class="tag" x="28" y="48">YOUR LISTS</text>
  <text class="h" x="28" y="80">Spotify</text>
  <text class="h" x="28" y="106">SoundCloud</text>
  <text class="h" x="28" y="132">YouTube</text>
  <text class="t" x="28" y="166">playlists, likes, sets</text>

  <rect class="hero" x="230" y="20" width="164" height="168" rx="14"/>
  <g transform="translate(260 48)" fill="none" stroke="url(#echo)">
    <circle r="6.5" stroke-width="2.4"/><circle r="10" stroke-width="1.9" stroke-opacity="0.7"/><circle r="13" stroke-width="1.4" stroke-opacity="0.42"/>
  </g>
  <circle cx="260" cy="48" r="2.9" fill="url(#echo)"/>
  <text class="h" x="282" y="54" style="font-size:18px">Echolot</text>
  <text class="t" x="248" y="86">reads your lists</text>
  <text class="t" x="248" y="108">finds missing songs</text>
  <text class="t" x="248" y="130">checks every file</text>
  <text class="t" x="248" y="152">files, tags, upgrades</text>
  <text class="t" x="248" y="174">writes playlists</text>

  <rect class="box" x="450" y="20" width="164" height="168" rx="14"/>
  <text class="tag" x="468" y="48">MUSIC FOLDER</text>
  <text class="m" x="468" y="82">tracks/</text>
  <text class="t" x="468" y="104">one file per song</text>
  <text class="m" x="468" y="140">playlists/</text>
  <text class="t" x="468" y="162">one .m3u per list</text>

  <rect class="box" x="670" y="20" width="164" height="168" rx="14"/>
  <text class="tag" x="688" y="48">MUSIC SERVER</text>
  <text class="h" x="688" y="80">Navidrome</text>
  <text class="t" x="688" y="108">your users</text>
  <text class="t" x="688" y="130">your playlists</text>

  <rect class="box" x="890" y="20" width="164" height="168" rx="14"/>
  <text class="tag" x="908" y="48">PLAYERS</text>
  <text class="h" x="908" y="80">Feishin</text>
  <text class="h" x="908" y="106">Symfonium</text>
  <text class="t" x="908" y="140">or any</text>
  <text class="t" x="908" y="162">Subsonic app</text>

  <!-- where the songs come from: below Echolot, a straight line up to it each -->
  <rect class="side" x="52" y="252" width="250" height="96" rx="14"/>
  <text class="tag" x="70" y="278">SOULSEEK</text>
  <text class="h" x="70" y="306">FLAC first</text>
  <text class="t" x="70" y="330">via Sockseek or slskd</text>
  <rect class="side" x="322" y="252" width="250" height="96" rx="14"/>
  <text class="tag" x="340" y="278">FALLBACK</text>
  <text class="h" x="340" y="306">YouTube, SoundCloud</text>
  <text class="t" x="340" y="330">when Soulseek has none</text>

  <!-- the flow: straight lines only -->
  <path class="arrow" d="M174 104 H224" marker-end="url(#a)"/>
  <text class="label" x="184" y="96">reads</text>
  <path class="arrow hot" d="M394 104 H444" marker-end="url(#ah)"/>
  <text class="label" x="408" y="96">files</text>
  <path class="arrow" d="M614 104 H664" marker-end="url(#a)"/>
  <text class="label" x="619" y="96">imports</text>
  <path class="arrow" d="M834 104 H884" marker-end="url(#a)"/>
  <text class="label" x="839" y="96">streams</text>
  <path class="arrow hot" d="M282 188 V246" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="arrow" d="M342 188 V246" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="label" x="352" y="222">search, download</text>
</svg>
