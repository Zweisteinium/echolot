name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency: # a newer push to a pull request supersedes its running check; main runs every commit (releases)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: echolot:ci
          build-args: |
            ECHOLOT_VERSION=${{ steps.version.outputs.version }}
            ECHOLOT_COMMIT=${{ github.sha }}
          cache-from: type=gha # the ffmpeg stage takes minutes to build; cached it takes seconds
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm -v "$PWD/tools:/tools:ro" echolot:ci python /tools/smoke.py
      - name: The web app answers
        run: |
          docker run -d --name echolot --tmpfs /data:uid=1000,gid=1000 -e ECHOLOT_WORKER=off -p 8490:8490 echolot:ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8490/healthz && exit 0; sleep 1; done
          docker logs echolot
          exit 1

  release:
    # a version in pyproject.toml without its tag yet: tag the tested commit and publish the release notes
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git log --no-merges --format='- %s' ${previous:+$previous..}HEAD > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "Echolot $version" --notes-file notes.md
