name: Sockseek image

# The Sockseek image of deploy/sockseek, built and tested on every change. From main or a run by hand it is
# pushed under the TAG in its Dockerfile, unless that tag exists. A published tag is never replaced.
on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
    paths: [deploy/sockseek/**, .github/workflows/sockseek.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: lordlayer/echolot-sockseek

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          tag=$(sed -n 's/^ARG TAG=//p' deploy/sockseek/Dockerfile)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$tag" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4 # for the arm64 runtime stage, the .NET build cross-compiles
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: deploy/sockseek
          platforms: linux/amd64
          load: true
          tags: sockseek:ci
          cache-from: type=gha,scope=sockseek
          cache-to: type=gha,scope=sockseek,mode=max
      - name: The daemon answers
        run: |
          docker run --rm --entrypoint sh sockseek:ci -c 'test "$(id -u)" = 1000 && test -x /usr/bin/sockseek && sh -n /run.sh'
          docker run -d --name sockseek --entrypoint sockseek -p 5031:5031 sockseek:ci \
            daemon --server-ip 0.0.0.0 --server-port 5031 -o /tmp/out
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:5031/api/server/status && exit 0; sleep 1; done
          docker logs sockseek
          exit 1
      - if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.tag.outputs.published != 'true'
        uses: docker/login-action@v4
        with:
          username: lordlayer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.tag.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: deploy/sockseek
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=sockseek
